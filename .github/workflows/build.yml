name: Build Native APK
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'App Idea Prompt'
        required: true
      app_name:
        description: 'App Name'
        required: true
      app_id:
        description: 'Unique App ID Suffix'
        required: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Native Java Android Project
        env:
          USER_PROMPT: ${{ github.event.inputs.prompt }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_ID: ${{ github.event.inputs.app_id }}
        run: |
          mkdir -p app/src/main/java/com/ai/$APP_ID
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle
          rootProject.name = "AIApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace "com.ai.$APP_ID"
              compileSdk 34
              defaultConfig {
                  applicationId "com.ai.$APP_ID"
                  minSdk 21
                  targetSdk 28
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="$APP_NAME"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Ask AI to write Pure Native Android Java (MainActivity.java)
          python3 - << 'EOF'
          import os, json, urllib.request

          prompt = os.environ['USER_PROMPT']
          app_id = os.environ['APP_ID']

          sys_prompt = (
              f"Write a COMPLETE, single-file native Android Java class `MainActivity` in package `com.ai.{app_id}`. "
              "Return ONLY valid Java source code starting with `package com.ai." + app_id + ";` and ending with `}`. "
              "Do NOT use markdown fences. Do NOT use AndroidX or external libraries; use ONLY standard `android.*` and `java.*` packages "
              "(such as `android.app.Activity`, `android.widget.*`, `android.graphics.pdf.PdfDocument`, `android.graphics.*`, `android.content.*`, `android.net.Uri`, `android.os.*`). "
              "Build the entire UI programmatically in `onCreate` using `ScrollView`, `LinearLayout`, `Button`, `EditText`, `TextView`, etc. "
              "Include full working logic, file pickers (`Intent.ACTION_GET_CONTENT` with `EXTRA_ALLOW_MULTIPLE`), and save outputs to `Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)`. "
              "App to build: " + prompt
          )

          data = json.dumps({
              "messages": [{"role": "user", "content": sys_prompt}],
              "model": "openai"
          }).encode('utf-8')

          req = urllib.request.Request("https://text.pollinations.ai/", data=data, headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=90) as resp:
              code = resp.read().decode('utf-8').strip()

          if "```" in code:
              lines = [l for l in code.splitlines() if not l.strip().startswith("```")]
              code = "\n".join(lines)
          if "package " in code:
              code = code[code.index("package "):]

          with open(f"app/src/main/java/com/ai/{app_id}/MainActivity.java", "w", encoding="utf-8") as f:
              f.write(code)
          EOF

      - name: Compile APK with Official Android SDK Gradle
        env:
          APP_ID: ${{ github.event.inputs.app_id }}
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ${{ github.event.inputs.app_id }}.apk
          gh release create "v-${{ github.event.inputs.app_id }}" "${{ github.event.inputs.app_id }}.apk" --title "Build ${{ github.event.inputs.app_id }}" --notes "Native Android APK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
