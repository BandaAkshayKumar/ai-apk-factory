name: Build Native APK
on:
  workflow_dispatch:
    inputs:
      prompt:
        required: true
      app_name:
        required: true
      app_id:
        required: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Generate and Compile Native Android App
        env:
          USER_PROMPT: ${{ github.event.inputs.prompt }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_ID: ${{ github.event.inputs.app_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/java/com/ai/$APP_ID
          mkdir -p app/src/main/assets
          cat << 'EOF' > settings.gradle
          rootProject.name = "AIApp"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat << EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace "com.ai.$APP_ID"
              compileSdk 34
              defaultConfig {
                  applicationId "com.ai.$APP_ID"
                  minSdk 21
                  targetSdk 28
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="$APP_NAME"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'PYEOF' > gen_java.py
          import os, json, urllib.request
          prompt = os.environ['USER_PROMPT']
          app_id = os.environ['APP_ID']
          sys_java = (
              f'Write a COMPLETE single-file Android Java class MainActivity in package com.ai.{app_id}. '
              f'Return ONLY valid Java code starting with package com.ai.{app_id}; and ending with }}. '
              'Do NOT use markdown fences. Use ONLY standard android.* and java.* packages (Activity, LinearLayout, ScrollView, Button, EditText, TextView, PdfDocument, Bitmap, BitmapFactory, Canvas, Paint, Intent, Uri, Bundle, BufferedReader, InputStreamReader, InputStream, OutputStream, ArrayList, Toast). '
              'Build the UI programmatically in onCreate. Use ACTION_GET_CONTENT with EXTRA_ALLOW_MULTIPLE to pick multiple files, and use Intent.ACTION_CREATE_DOCUMENT with type application/pdf so the user can choose the exact save location in local storage without needing storage permissions! '
              'App idea: ' + prompt
          )
          req = urllib.request.Request('https://text.pollinations.ai/', data=json.dumps({'messages':[{'role':'user','content':sys_java}],'model':'openai'}).encode('utf-8'), headers={'Content-Type':'application/json', 'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=90) as r:
              code = r.read().decode('utf-8').strip()
          if '```' in code:
              code = '\n'.join([l for l in code.splitlines() if not l.strip().startswith('```')])
          if 'package ' in code:
              code = code[code.index('package '):]
          with open(f'app/src/main/java/com/ai/{app_id}/MainActivity.java', 'w', encoding='utf-8') as f:
              f.write(code)
          PYEOF
          python3 gen_java.py || true
          if ! gradle assembleDebug; then
            cat << 'PYEOF2' > gen_html.py
          import os, json, urllib.request
          prompt = os.environ['USER_PROMPT']
          sys_html = (
              'Return ONLY raw HTML5 code starting with <!DOCTYPE html> and ending with </html>. '
              'Include CSS in <style> and JS in <script>. Load pdf-lib and jspdf from cdnjs.cloudflare.com to merge .pdf, .jpg, .png, .txt, .eml files and URLs into a single PDF. '
              'When saving the merged PDF, convert the PDF bytes to a Base64 string and call window.AndroidBridge.saveFileWithPicker(base64String, "merged.pdf") so the user can choose the save location in local storage! '
              'Build: ' + prompt
          )
          req = urllib.request.Request('https://text.pollinations.ai/', data=json.dumps({'messages':[{'role':'user','content':sys_html}],'model':'openai'}).encode('utf-8'), headers={'Content-Type':'application/json', 'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=90) as r:
              html = r.read().decode('utf-8').strip()
          if '<!DOCTYPE html>' in html: html = html[html.index('<!DOCTYPE html>'):]
          elif '<html' in html: html = html[html.index('<html'):]
          if '</html>' in html: html = html[:html.rindex('</html>')+7]
          with open('app/src/main/assets/index.html', 'w', encoding='utf-8') as f: f.write(html)
          PYEOF2
            python3 gen_html.py
            cat << EOF > app/src/main/java/com/ai/$APP_ID/MainActivity.java
          package com.ai.$APP_ID;
          import android.app.Activity;
          import android.content.*;
          import android.net.Uri;
          import android.os.*;
          import android.util.Base64;
          import android.webkit.*;
          import android.widget.Toast;
          import java.io.*;
          public class MainActivity extends Activity {
              private ValueCallback<Uri[]> cb;
              private byte[] pendingBytes;
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true);
                  w.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void saveFileWithPicker(String b64, String name) {
                          try {
                              if (b64.contains(",")) b64 = b64.substring(b64.indexOf(",") + 1);
                              pendingBytes = Base64.decode(b64, Base64.DEFAULT);
                              Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              i.setType("application/pdf");
                              i.putExtra(Intent.EXTRA_TITLE, name);
                              startActivityForResult(i, 102);
                          } catch (Exception e) {}
                      }
                  }, "AndroidBridge");
                  w.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> fileCb, FileChooserParams p) {
                          cb = fileCb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT).addCategory(Intent.CATEGORY_OPENABLE).setType("*/*").putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          startActivityForResult(Intent.createChooser(i, "Select Files"), 101);
                          return true;
                      }
                  });
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }
              @Override protected void onActivityResult(int req, int res, Intent d) {
                  if (req == 101 && cb != null) {
                      Uri[] u = null;
                      if (res == RESULT_OK && d != null) {
                          if (d.getClipData() != null) {
                              int c = d.getClipData().getItemCount(); u = new Uri[c];
                              for (int i=0; i<c; i++) u[i] = d.getClipData().getItemAt(i).getUri();
                          } else if (d.getData() != null) u = new Uri[]{d.getData()};
                      }
                      cb.onReceiveValue(u); cb = null;
                  } else if (req == 102 && res == RESULT_OK && d != null && pendingBytes != null) {
                      try {
                          OutputStream os = getContentResolver().openOutputStream(d.getData());
                          os.write(pendingBytes); os.flush(); os.close();
                          Toast.makeText(this, "Saved successfully!", Toast.LENGTH_LONG).show();
                      } catch (Exception e) {}
                  }
              }
          }
          EOF
            gradle assembleDebug
          fi
          cp app/build/outputs/apk/debug/app-debug.apk $APP_ID.apk
          gh release create "v-$APP_ID" "$APP_ID.apk" --title "Build $APP_ID" --notes "Signed Android APK"
