name: Build Native APK
on:
  workflow_dispatch:
    inputs:
      prompt:
        required: true
      app_name:
        required: true
      app_id:
        required: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile and Release APK
        env:
          USER_PROMPT: ${{ github.event.inputs.prompt }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_ID: ${{ github.event.inputs.app_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 build_apk.py
          gh release create "v-$APP_ID" "$APP_ID.apk" --title "Build $APP_ID" --notes "Signed Android APK"
